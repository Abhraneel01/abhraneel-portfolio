<header class="nav" [class.scrolled]="scrolled()">
  <div class="container nav-inner">
    <a href="#home" class="logo mono" (click)="close()">&lt;<span class="gradient-text">AK</span> /&gt;</a>

    <nav class="links" [class.open]="menuOpen()" aria-label="Main navigation">
      @for (link of links; track link.id) {
        <a [href]="'#' + link.id" [class.active]="active() === link.id" (click)="close()">{{ link.label }}</a>
      }
      <a class="btn btn-primary btn-sm resume" [href]="profile.resumeUrl" target="_blank" rel="noopener">Resume</a>
    </nav>

    <div class="actions">
      <button class="icon-btn" type="button" (click)="theme.toggle()" [attr.aria-label]="'Switch to ' + (theme.theme() === 'dark' ? 'light' : 'dark') + ' mode'">
        {{ theme.theme() === 'dark' ? '☀️' : '🌙' }}
      </button>
      <button class="icon-btn burger" type="button" (click)="menuOpen.set(!menuOpen())" aria-label="Toggle menu" [attr.aria-expanded]="menuOpen()">
        {{ menuOpen() ? '✕' : '☰' }}
      </button>
    </div>
  </div>
</header>
